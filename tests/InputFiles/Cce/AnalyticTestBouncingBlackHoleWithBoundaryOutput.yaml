# Example showing how to save analytic boundary data to H5 file
# that can be used by CharacteristicExtract

Executable: AnalyticTestCharacteristicExtract
Testing:
  Check: parse
  Timeout: 20
  Priority: High

---

Evolution:
  InitialTimeStep: 0.01
  MinimumTimeStep: 1e-7
  InitialSlabSize: 0.8
  VariableOrderAlgorithm:
    GoalOrder: 3

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons:
    CharacteristicEvolution:
      Proc: Auto
      Exclusive: false
    AnalyticWorldtubeBoundary:
      Proc: Auto
      Exclusive: false

Observers:
  VolumeFileName: "CharacteristicExtractUnusedVolume"
  ReductionFileName: "CharacteristicExtractReduction"

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Offset: 0
          Interval: 1
    Events:
      - ObserveTimeStep:
          SubfileName: CceTimeStep
          PrintTimeToTerminal: false

EventsAndTriggersAtSteps:

Cce:
  Evolution:
    TimeStepper:
      AdamsBashforth:
        Order: 3
    StepChoosers:
      - Constant: 0.1
      - LimitIncrease:
          Factor: 2

  LMax: 8
  NumberOfRadialPoints: 8
  ObservationLMax: 8

  StartTime: 0.0
  EndTime: 0.8
  ExtractionRadius: 30.0

  # Set this to save boundary data to H5 file
  # Output will be saved to AnalyticBoundaryCceR0030.h5
  AnalyticBoundaryDataFilePrefix: "AnalyticBoundary"

  AnalyticSolution:
    BouncingBlackHole:
      Period: 40.0
      ExtractionRadius: 30.0
      Mass: 1.0
      Amplitude: 2.0

  Filtering:
    RadialFilterHalfPower: 24
    RadialFilterAlpha: 35.0
    FilterLMax: 6

  ScriInterpOrder: 3
  ScriOutputDensity: 1
